<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Página no encontrada — AgroCore</title>
<meta content="noindex,follow" name="robots"/>
<meta content="#143C19" name="theme-color"/>
<link href="img/logo-icon-128.png" rel="icon"/>
<style>
:root{--ink:#143C19;--green:#1B5E20;--gold:#E8AC1E;--cream:#F4F3EA;--text:#243229;--muted:#69766d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--cream);text-align:center;padding:24px}
.box{max-width:560px}
img{display:block;margin:0 auto 24px;width:88px;height:88px}
.code{font-size:clamp(64px,14vw,120px);font-weight:850;color:var(--ink);line-height:1;letter-spacing:-.04em}
h1{font-size:clamp(24px,4vw,34px);color:var(--ink);margin:12px 0 0;letter-spacing:-.03em}
p{color:var(--muted);font-size:17px;margin:14px 0 28px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:50px;padding:0 26px;border-radius:999px;font-weight:780;text-decoration:none;transition:.2s}
.btn:hover{transform:translateY(-2px)}
.gold{background:var(--gold);color:#342800}
.outline{border:1px solid #c9d7ca;color:var(--ink);background:#fff}
</style>
</head>
<body>
<div class="box">
<img src="img/logo-icon-128.png" alt="AgroCore"/>
<div class="code">404</div>
<h1>Esta página no existe</h1>
<p>Puede que el enlace esté roto o que la página se haya movido. Volvé al inicio y seguí explorando AgroCore.</p>
<div class="btns">
<a class="btn gold" href="/">Ir al inicio</a>
<a class="btn outline" href="/software-agricola">Ver el software</a>
</div>
</div>
</body>
</html>
